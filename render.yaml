databases:
  - name: dofd-db
    databaseName: strapi
    user: strapi
    plan: starter

services:
  - type: web
    name: dofd-strapi
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && mkdir -p public/uploads && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: true
    disk:
      name: strapi-uploads
      mountPath: /opt/render/project/src/backend/public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: dofd-db
          property: connectionString
      - key: DATABASE_SSL
        value: false
      - key: YOXA_TRIGGER_ENDPOINT
        sync: false
      - key: YOXA_DEPLOYMENT_SECRET
        sync: false
      - key: YOXA_TRIGGER_TEXT_PREFIX
        value: Submitted external form
      - key: YOXA_TOOL_API_KEY
        generateValue: true
